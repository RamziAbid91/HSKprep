name: HSKPrep
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  HSKPrep:
    type: application
    platform: iOS
    sources: [HSKPrep]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hskprep
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: HSK Prep
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
